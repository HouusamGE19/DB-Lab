server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: database-performance-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/perflab}
    username: ${DB_USER:perflab}
    password: ${DB_PASSWORD:perflab}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
